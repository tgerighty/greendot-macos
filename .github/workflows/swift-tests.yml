name: Swift tests

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode 26.3
        run: |
          sudo xcode-select --switch /Applications/Xcode_26.3.app
          xcodebuild -version
          swift --version
      - name: Build and test Swift package
        run: swift test
      - name: Confirm AppKit menu tests independently
        if: failure()
        run: swift test --filter 'MenuBuilderTests'
      - name: Isolate StatusMenuController failure
        if: failure()
        env:
          SWIFT_BACKTRACE: enable=yes
        run: swift test --filter 'StatusMenuControllerTests/testControllersOwnIndependentMenusAndStableHandlers'
      - name: Capture AppKit test crash report
        if: failure()
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          reports = Path.home() / "Library/Logs/DiagnosticReports"
          candidates = sorted(
              (path for suffix in ("*.ips", "*.crash") for path in reports.glob(suffix)
               if "greendot" in path.name.lower() and path.stat().st_mtime > __import__("time").time() - 1200),
              key=lambda path: path.stat().st_mtime,
              reverse=True,
          )
          if not candidates:
              print("No recent greendot crash report found.")
              raise SystemExit(0)

          report = candidates[0]
          print(f"Crash report: {report.name}")
          try:
              data = json.loads(report.read_text())
              for key in ("app_name", "procName", "captureTime", "timestamp", "exception", "termination", "faultingThread"):
                  if key in data:
                      print(f"{key}: {data[key]}")
              threads = data.get("threads", [])
              faulting = data.get("faultingThread")
              if isinstance(faulting, int) and faulting < len(threads):
                  frames = threads[faulting].get("frames", [])
                  for frame in frames[:40]:
                      print("frame:", frame.get("symbol", frame.get("image", "?")), frame.get("image", ""))
          except (json.JSONDecodeError, UnicodeDecodeError):
              lines = report.read_text(errors="replace").splitlines()
              for line in lines:
                  if line.startswith(("Exception Type:", "Termination Reason:", "Crashed Thread:")):
                      print(line)
          PY
